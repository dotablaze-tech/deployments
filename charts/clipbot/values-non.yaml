image:
  tag: ""

ingress:
  hosts:
    - host: clipbot.non.jdwlabs.com

externalSecrets:
  - refreshInterval: 1m
    secretStoreName: vault
    secretName: clipbot-non

# One Vault entry serves both envs (one channel). Property names must match
# what the owner stores at kv/dotablaze-tech-clipbot.
envSecrets:
  - secretKey: CLIP_KEY
    key: dotablaze-tech-clipbot
    property: clip_key
    secretName: clipbot-non
  - secretKey: TWITCH_CLIENT_ID
    key: dotablaze-tech-clipbot
    property: client_id
    secretName: clipbot-non
  - secretKey: TWITCH_CLIENT_SECRET
    key: dotablaze-tech-clipbot
    property: client_secret
    secretName: clipbot-non
  - secretKey: TWITCH_REFRESH_TOKEN
    key: dotablaze-tech-clipbot
    property: refresh_token
    secretName: clipbot-non
  - secretKey: TWITCH_BROADCASTER_ID
    key: dotablaze-tech-clipbot
    property: broadcaster_id
    secretName: clipbot-non

deploymentAnnotations:
  secret.reloader.stakater.com/reload: "clipbot-non"

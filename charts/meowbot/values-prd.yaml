image:
  tag: "1.0.10@sha256:46d2cb2e5ab9de4547daff5ddd883e3a04175d1ef1b611c9d4e4765591ccbd22"

ingress:
  hosts:
    - host: meowbot.prd.jdwlabs.com

externalSecrets:
  - refreshInterval: 1m
    secretStoreName: k8s-secret-store
    secretName: meowbot-pg-prd
  - refreshInterval: 1m
    secretStoreName: vault
    secretName: meowbot-prd

envs:
  MODE: production
  DEBUG: false
  DATABASE_URL: jdbc:postgresql://platform-postgresql-cluster-prd-rw.database:5432/dotablazetech_prd
  DATABASE_HOST: platform-postgresql-cluster-prd-rw.database
  DATABASE_PORT: 5432
  DATABASE_NAME: dotablazetech_prd

envSecrets:
  - secretKey: DATABASE_USER
    key: platform-postgresql-cluster-prd-app
    property: username
    secretName: meowbot-pg-prd
  - secretKey: DATABASE_PASSWORD
    key: platform-postgresql-cluster-prd-app
    property: password
    secretName: meowbot-pg-prd
  - secretKey: DISCORD_BOT_TOKEN
    key: dotablaze-tech-discord-bot-token
    property: token
    secretName: meowbot-prd

# Opt-in for Reloader: comma-separated Secret names, matching the two
# distinct secretName values among the envSecrets entries above.
deploymentAnnotations:
  secret.reloader.stakater.com/reload: "meowbot-pg-prd,meowbot-prd"
